name: import-ipa

# 本リポジトリの開発環境からは ipa.go.jp へ到達できないため、
# IPA 公式 PDF の取得・解析は GitHub Actions ランナー上で実行する。
on:
  push:
    branches: [claude/jpfetest-exam-simulator-wp0b38]
    paths:
      - 'tools/**'
      - 'schema/**'
      - '.github/workflows/import-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-ipa
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      # PDF は毎回 IPA から取り直さない（相手サーバへの負荷と実行時間の両方を減らす）
      - name: restore PDF cache
        uses: actions/cache@v4
        with:
          path: data/pdf-cache
          key: ipa-pdf-cache-v1-${{ github.run_id }}
          restore-keys: |
            ipa-pdf-cache-v1-

      - name: discover — IPA 公開 PDF を全件列挙
        run: npm run discover

      - name: scan-text — テキスト経路 / 画像経路の判定
        run: node tools/scan-text.mjs

      - name: build-text — テキスト経路の問題を構造化
        run: |
          mkdir -p data/probe
          set -o pipefail
          node tools/build-text.mjs 2>&1 | tee data/probe/text-route-log.txt

      - name: dedup — 同一問題の名寄せ
        run: node tools/dedup.mjs

      - name: validate — 出典・選択肢・解答の検証ゲート
        run: npm run validate

      - name: upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-output
          path: |
            data/sources.json
            data/probe/**
            data/questions/**
            data/quarantine/**
          if-no-files-found: warn

      - name: commit data
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "jpfetest-importer"
          git config user.email "noreply@github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: import IPA past exam questions [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

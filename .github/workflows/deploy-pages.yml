name: deploy-pages

# アプリを直せば公開物も直る、という状態にしておく。
#
# 以前は workflow_dispatch だけにしていたが、既定ブランチに無いワークフローは
# GitHub に登録されず、手動実行もできない（dispatch が 404 になる）。
# そのせいで一度も公開できていなかった。
#
# データの取り込みコミットでは動かさない。切り出し画像を含めると
# 成果物が 150MB を超えるので、アプリを変えたときだけ公開する。
on:
  push:
    branches: [claude/jpfetest-exam-simulator-wp0b38]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

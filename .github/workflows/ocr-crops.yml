name: ocr-crops

# 画像経路の問題に OCR テキストを付け、名寄せ（重複統合）を動かすためのワークフロー。
#
# OCR 結果は名寄せ・検索・解説作成にだけ使い、出題時には表示しない。
# 切り出し画像 1 枚あたり 1〜2 秒なので、6 並列で 4,800 枚を 20〜30 分で処理できる。
on:
  push:
    branches: [claude/jpfetest-exam-simulator-wp0b38]
    paths:
      - 'tools/ocr-crops.mjs'
      - 'tools/lib/ocr.mjs'
      - '.github/workflows/ocr-crops.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ocr-crops
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    env:
      SHARD_INDEX: ${{ matrix.index }}
      SHARD_TOTAL: '6'
      TIME_BUDGET_SEC: '12000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install tesseract 日本語
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn

      - name: install
        run: npm ci

      - name: test
        run: npm test

      - name: ocr-crops — 切り出し画像から OCR テキストを付ける
        run: |
          mkdir -p data/probe
          set -o pipefail
          node tools/ocr-crops.mjs 2>&1 | tee data/probe/ocr-crops-log-${{ matrix.index }}.txt

      # このシャードが実際に書き換えたファイルだけをまとめる。
      # チェックアウトしたままの 97 ファイルまで上げると、merge-multiple の
      # 上書きで他シャードの成果が消える（実際に 4,868 問中 4,086 問を失った）。
      - name: stage only this shard's changes
        if: always()
        run: |
          mkdir -p staged
          git ls-files -mo --exclude-standard -- data | while read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "staged/$(dirname "$f")"
            cp "$f" "staged/$f"
          done
          echo "このシャードの変更ファイル: $(find staged -type f | wc -l) 件"

      - name: upload shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-shard-${{ matrix.index }}
          path: staged/
          if-no-files-found: warn
          retention-days: 3

  consolidate:
    needs: ocr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      - name: collect shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ocr-shard-*
          merge-multiple: true
          path: collected

      - name: merge into data/
        run: |
          # 各シャードは自分が書き換えたファイルだけを上げている（回ごとに分担）ので、
          # 名前が衝突することはなく、そのまま上書きしてよい。
          # 派生ファイル（index / dedup）はこのあと作り直すので触らない。
          mkdir -p data/questions data/probe
          find collected -name '*.json' -path '*questions*' \
            ! -name 'index.json' ! -name 'dedup.json' ! -name 'manifest.json' \
            -exec cp {} data/questions/ \;
          find collected -name 'ocr-crops-log-*.txt' -exec cp {} data/probe/ \; || true

      # 静かにデータを失う事故は目視では気付けないので、ここで機械的に止める。
      - name: assert OCR coverage
        run: node tools/check-ocr-coverage.mjs

      - name: dedup / validate / report
        run: |
          node tools/dedup.mjs
          node tools/validate.mjs
          node tools/report.mjs > /dev/null

      - name: commit data
        if: always()
        continue-on-error: true
        run: |
          bash tools/commit-data.sh "data: add OCR text to scanned questions and merge duplicates"

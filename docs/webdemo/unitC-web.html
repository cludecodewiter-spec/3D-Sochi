let lang = 'zh';
const L = (t) => (t && (t[lang] || t.zh || t.ja)) || '';
const partObjs = {}, origPos = {}, animTarget = {};
let highlighted = null, renderer=null, scene=null, camera=null, controls=null, center=new THREE.Vector3(), radius=2;

// ---------- 面板内容(不依赖 WebGL,始终显示) ----------
const steps = MANIFEST.procedure.steps.slice().sort((a,b)=>a.order-b.order);
let idx = 0, checked = [];

function buildPartList(){
  const box = document.getElementById('parts'); box.innerHTML = '';
  MANIFEST.parts.forEach(p => {
    const row = document.createElement('div'); row.className='part'; row.dataset.node=p.node;
    const eye = document.createElement('input'); eye.type='checkbox'; eye.checked=true;
    eye.onclick = (e)=>{ e.stopPropagation(); if(partObjs[p.node]) partObjs[p.node].visible=eye.checked; };
    const nm = document.createElement('span'); nm.className='pn'; nm.textContent=L(p.name);
    row.appendChild(eye); row.appendChild(nm);
    row.onclick = ()=> setHighlight(p.node);
    box.appendChild(row);
  });
}
function setHighlight(node){
  if(highlighted && partObjs[highlighted]) partObjs[highlighted].traverse(m=>{ if(m.isMesh&&m.material&&m.userData._e!==undefined){ m.material.emissive.setHex(m.userData._e); delete m.userData._e; }});
  highlighted = node;
  if(node && partObjs[node]) partObjs[node].traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive){ m.userData._e=m.material.emissive.getHex(); m.material.emissive.setHex(0x1e5bb8); }});
  document.querySelectorAll('.part').forEach(el=>el.classList.toggle('sel', el.dataset.node===node));
}
function renderStep(){
  const s = steps[idx];
  document.getElementById('title').textContent = L(MANIFEST.procedure.title);
  document.getElementById('prog').textContent = (lang==='zh'?'步骤 ':'ステップ ')+(idx+1)+'/'+steps.length;
  document.getElementById('instr').textContent = s ? L(s.instruction) : '';
  checked = (s?s.safetyChecks:[]).map(()=>false);
  const sc = document.getElementById('safety'); sc.innerHTML='';
  (s?s.safetyChecks:[]).forEach((chk,i)=>{
    const row=document.createElement('label'); row.className='chk';
    const cb=document.createElement('input'); cb.type='checkbox';
    cb.onchange=()=>{ checked[i]=cb.checked; updateGate(); };
    const tx=document.createElement('span'); tx.textContent=L(chk.text);
    row.appendChild(cb); row.appendChild(tx);
    if(chk.required){ const b=document.createElement('b'); b.className='req'; b.textContent=lang==='zh'?'必填':'必須'; row.appendChild(b); }
    sc.appendChild(row);
  });
  if(s) setHighlight(s.targetPart);
  updateGate();
}
function allReq(){ const s=steps[idx]; return !s || s.safetyChecks.every((c,i)=>!c.required||checked[i]); }
function updateGate(){ const ok=allReq()&&idx<steps.length; document.getElementById('next').disabled=!ok; document.getElementById('gate').style.display=ok?'none':'block'; }
function next(){
  const s=steps[idx]; if(!s||!allReq()) return;
  if(s.action==='remove'&&s.removeOffset&&origPos[s.targetPart]){ const o=origPos[s.targetPart]; animTarget[s.targetPart]=new THREE.Vector3(o.x+s.removeOffset[0],o.y+s.removeOffset[1],o.z+s.removeOffset[2]); }
  if(idx<steps.length) idx++;
  document.getElementById('done').style.display = idx>=steps.length?'block':'none';
  renderStep();
}
function prev(){ if(idx===0) return; idx--; document.getElementById('done').style.display='none'; const s=steps[idx]; if(s&&origPos[s.targetPart]) animTarget[s.targetPart]=origPos[s.targetPart].clone(); renderStep(); }
function explodeAll(){ steps.forEach(s=>{ if(s.action==='remove'&&s.removeOffset&&origPos[s.targetPart]){ const o=origPos[s.targetPart]; animTarget[s.targetPart]=new THREE.Vector3(o.x+s.removeOffset[0]*1.1,o.y+s.removeOffset[1]*1.1,o.z+s.removeOffset[2]*1.1);} }); }
function reassemble(){ Object.keys(origPos).forEach(n=> animTarget[n]=origPos[n].clone()); }

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('explode').onclick=explodeAll;
document.getElementById('reset').onclick=()=>{ reassemble(); if(camera) resetView(); };
document.getElementById('lang').onclick=()=>{ lang=lang==='zh'?'ja':'zh'; buildPartList(); renderStep(); document.getElementById('lang').textContent=lang==='zh'?'日本語':'中文'; };

buildPartList(); renderStep();   // ★ 内容先渲染,不等 3D

// ---------- 3D(WebGL,失败则降级提示) ----------
const canvas = document.getElementById('c');
function resetView(){ const dd=radius*2.1; camera.position.set(center.x+dd*0.7,center.y+dd*0.4,center.z+dd*0.95); controls.target.copy(center); controls.update(); }
function b64ToBuf(b){ const s=atob(b),n=s.length,a=new Uint8Array(n); for(let i=0;i<n;i++)a[i]=s.charCodeAt(i); return a.buffer; }
function init3D(){
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b3038);
  camera = new THREE.PerspectiveCamera(42,1,0.05,100);
  controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08;
  scene.add(new THREE.AmbientLight(0xffffff,0.4));
  const k=new THREE.DirectionalLight(0xffffff,2.0); k.position.set(3,5,4); scene.add(k);
  const f=new THREE.DirectionalLight(0xaecbe0,0.7); f.position.set(-4,1.5,2); scene.add(f);
  const r=new THREE.DirectionalLight(0xbcd0e0,0.7); r.position.set(.5,3,-5); scene.add(r);
  const g=new THREE.GridHelper(8,16,0x4a5560,0x3a424c); g.position.y=-1.25; scene.add(g);
  new THREE.GLTFLoader().parse(b64ToBuf(GLB_B64),'',(gltf)=>{
    const root=gltf.scene; scene.add(root);
    MANIFEST.parts.forEach(p=>{ const o=root.getObjectByName(p.node); if(o){ partObjs[p.node]=o; origPos[p.node]=o.position.clone(); animTarget[p.node]=o.position.clone(); }});
    const box=new THREE.Box3().setFromObject(root); box.getCenter(center); const sz=box.getSize(new THREE.Vector3()); radius=Math.max(sz.x,sz.y,sz.z);
    resetView(); setHighlight(steps[idx]?steps[idx].targetPart:null);
    document.getElementById('load').style.display='none';
  }, (err)=>{ fail('模型解析失败 / モデル読込失敗'); });
  const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
  canvas.addEventListener('click',(ev)=>{ const b=canvas.getBoundingClientRect(); mouse.x=((ev.clientX-b.left)/b.width)*2-1; mouse.y=-((ev.clientY-b.top)/b.height)*2+1; ray.setFromCamera(mouse,camera); const hits=ray.intersectObjects(Object.values(partObjs),true); if(hits.length){ let o=hits[0].object; while(o){ if(partObjs[o.name]){ setHighlight(o.name); break; } o=o.parent; } } });
  (function tick(){ requestAnimationFrame(tick); for(const n in animTarget){ const o=partObjs[n]; if(o) o.position.lerp(animTarget[n],0.15); } const w=canvas.clientWidth,h=canvas.clientHeight; if(w&&h&&(canvas.width!==w||canvas.height!==h)){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } controls.update(); renderer.render(scene,camera); })();
}
function fail(msg){ const el=document.getElementById('load'); el.innerHTML='<div style="padding:20px;color:#B0BEC5;text-align:center">⚠ '+msg+'<br><span style="font-size:12px">此预览环境可能禁用了脚本/WebGL。请下载后用浏览器打开。<br>このプレビューではWebGLが無効の可能性。ダウンロードしてブラウザで開いてください。</span></div>'; el.style.display='flex'; }
try { init3D(); } catch(e){ fail('3D 初始化失败:'+e.message); }
</script>
</body></html>

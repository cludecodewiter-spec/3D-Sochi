<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2560" font-family="'Segoe UI','Microsoft YaHei',sans-serif" viewBox="0 0 1320 2560">
  <rect width="1320" height="2560" fill="#ECEFF1"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1E2A38">除害装置 3D 维护训练系统 — UI 示意图 / UIモック</text>
  <text x="40" y="74" font-size="14" fill="#607D8B">基于 MainWindow.xaml 实际布局与配色;文案随语言(中/日)切换,此处中文为主、日文为辅注。</text>

  <!-- ================= SCREEN 1: 设备库 / Device Library ================= -->
  <text x="40" y="120" font-size="18" font-weight="700" fill="#37474F">① 起始页 · 设备库(M9)</text>
  <g transform="translate(40,140)">
    <rect width="1240" height="620" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
    <!-- top bar -->
    <rect width="1240" height="48" rx="6" fill="#1E2A38"/>
    <rect y="24" width="1240" height="24" fill="#1E2A38"/>
    <text x="16" y="31" font-size="15" font-weight="700" fill="#FFFFFF">除害装置 3D 维护训练系统</text>
    <rect x="1150" y="9" width="78" height="30" rx="4" fill="#37474F"/>
    <text x="1189" y="29" font-size="13" fill="#FFF" text-anchor="middle">语言/言語</text>
    <!-- body -->
    <text x="24" y="92" font-size="20" font-weight="700" fill="#263238">设备库 / 設備ライブラリ</text>
    <!-- cards -->
    <g>
      <rect x="24" y="112" width="240" height="140" rx="6" fill="#FAFAFA" stroke="#90A4AE"/>
      <text x="144" y="180" font-size="40" text-anchor="middle">📦</text>
      <text x="144" y="220" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">除害装置 A 型</text>
      <text x="144" y="240" font-size="12" fill="#78909C" text-anchor="middle">卧式 · 4 部件</text>
    </g>
    <g>
      <rect x="288" y="112" width="240" height="140" rx="6" fill="#FAFAFA" stroke="#90A4AE"/>
      <text x="408" y="180" font-size="40" text-anchor="middle">📦</text>
      <text x="408" y="220" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">除害装置 B 型(立式塔)</text>
      <text x="408" y="240" font-size="12" fill="#78909C" text-anchor="middle">立式 · 5 部件</text>
    </g>
    <text x="24" y="300" font-size="13" fill="#90A4AE">（点击卡片 → 校验清单 → 加载模型进入训练界面;坏清单会在此红字拦截提示）</text>
    <!-- disclaimer -->
    <rect y="584" width="1240" height="36" fill="#B71C1C"/>
    <rect y="584" width="1240" height="6" fill="#B71C1C"/>
    <text x="620" y="607" font-size="13" font-weight="600" fill="#FFF" text-anchor="middle">⚠ 训练辅助,实际作业以官方程序为准 / 訓練補助。実際の作業は公式手順に従ってください。</text>
  </g>

  <!-- ================= SCREEN 2: 训练界面 / Training ================= -->
  <text x="40" y="820" font-size="18" font-weight="700" fill="#37474F">② 训练界面 · 部件树 + 3D 视口 + 步骤/安全门(M2–M8)</text>
  <g transform="translate(40,840)">
    <rect width="1240" height="700" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
    <!-- top bar -->
    <rect width="1240" height="48" rx="6" fill="#1E2A38"/>
    <rect y="24" width="1240" height="24" fill="#1E2A38"/>
    <text x="16" y="31" font-size="15" font-weight="700" fill="#FFFFFF">除害装置 3D 维护训练系统</text>
    <g font-size="13" fill="#FFF" text-anchor="middle">
      <rect x="900" y="9" width="92" height="30" rx="4" fill="#37474F"/><text x="946" y="29">设备库/戻る</text>
      <rect x="1000" y="9" width="92" height="30" rx="4" fill="#37474F"/><text x="1046" y="29">考核模式</text>
      <rect x="1100" y="9" width="92" height="30" rx="4" fill="#37474F"/><text x="1146" y="29">语言/言語</text>
    </g>

    <!-- left part tree (260) -->
    <rect x="0" y="48" width="260" height="616" fill="#F4F6F8"/>
    <text x="12" y="76" font-size="15" font-weight="700" fill="#263238">部件列表 / 部品一覧</text>
    <g font-size="13" fill="#37474F">
      <rect x="8" y="90" width="244" height="30" rx="3" fill="#D6E4F0"/>
      <text x="16" y="110">主体外壳（P-000）</text><text x="236" y="110" text-anchor="end">👁</text>
      <text x="16" y="140">前面板（P-001）</text><text x="236" y="140" text-anchor="end">👁</text>
      <text x="16" y="170">滤芯（P-002）</text><text x="236" y="170" text-anchor="end">👁</text>
      <text x="16" y="200">送风机（P-003）</text><text x="236" y="200" text-anchor="end">👁</text>
    </g>
    <text x="12" y="240" font-size="11" fill="#90A4AE">选中 ↔ 3D 高亮(双向联动)</text>
    <g font-size="12" fill="#FFF" text-anchor="middle">
      <rect x="10" y="616" width="110" height="30" rx="4" fill="#546E7A"/><text x="65" y="636">隔离/アイソレート</text>
      <rect x="130" y="616" width="110" height="30" rx="4" fill="#546E7A"/><text x="185" y="636">全部显示</text>
    </g>

    <!-- center viewport (260..900) -->
    <rect x="260" y="48" width="640" height="616" fill="#20262E"/>
    <rect x="272" y="60" width="92" height="28" rx="4" fill="#455A64"/>
    <text x="318" y="79" font-size="12" fill="#FFF" text-anchor="middle">复位视角</text>
    <!-- fake 3D unit with highlight -->
    <g transform="translate(580,360)">
      <rect x="-90" y="-120" width="180" height="240" rx="4" fill="#5B6470" stroke="#8A93A0"/>
      <rect x="-80" y="-150" width="160" height="34" rx="3" fill="#3A6BB0" stroke="#FFD54F" stroke-width="3"/>
      <text x="0" y="-127" font-size="11" fill="#FFF" text-anchor="middle">前面板(高亮)</text>
      <rect x="-55" y="-60" width="110" height="90" rx="3" fill="#D9C04D"/>
      <text x="0" y="-10" font-size="11" fill="#5b4f10" text-anchor="middle">滤芯</text>
      <rect x="-45" y="50" width="90" height="60" rx="3" fill="#67B274"/>
      <text x="0" y="86" font-size="11" fill="#15401f" text-anchor="middle">送风机</text>
    </g>
    <!-- axis gizmo -->
    <g transform="translate(300,620)" stroke-width="2">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#E53935"/><text x="30" y="4" font-size="10" fill="#E53935">X</text>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#43A047"/><text x="-3" y="-30" font-size="10" fill="#43A047">Y</text>
      <line x1="0" y1="0" x2="-18" y2="14" stroke="#1E88E5"/><text x="-30" y="20" font-size="10" fill="#1E88E5">Z</text>
    </g>
    <text x="580" y="650" font-size="11" fill="#90A4AE" text-anchor="middle">左键旋转 · 滚轮缩放 · 右键平移 · 点选部件→列表反选</text>

    <!-- right step+safety panel (900..1240) -->
    <rect x="900" y="48" width="340" height="616" fill="#FAFAFA"/>
    <text x="912" y="76" font-size="15" font-weight="700" fill="#263238">前面板与滤芯拆卸</text>
    <text x="912" y="96" font-size="13" fill="#607D8B">步骤 / ステップ 1/3</text>
    <!-- instruction -->
    <rect x="912" y="108" width="316" height="60" rx="4" fill="#FFF8E1" stroke="#FFE082"/>
    <text x="924" y="132" font-size="13" fill="#5D4037">拧下四角螺栓,沿正前方</text>
    <text x="924" y="152" font-size="13" fill="#5D4037">取下前面板。</text>
    <!-- safety -->
    <text x="912" y="194" font-size="14" font-weight="700" fill="#263238">安全确认 / 安全確認</text>
    <g font-size="12.5">
      <rect x="912" y="206" width="316" height="1" fill="#E0E0E0"/>
      <rect x="916" y="214" width="16" height="16" rx="2" fill="#1976D2"/><text x="922" y="227" fill="#FFF" font-size="12">✓</text>
      <text x="940" y="227" fill="#263238">确认主电源已隔离、上锁并挂牌</text>
      <rect x="1180" y="214" width="44" height="18" rx="3" fill="#D32F2F"/><text x="1202" y="227" fill="#FFF" font-size="11" text-anchor="middle">必填</text>

      <rect x="916" y="244" width="16" height="16" rx="2" fill="#1976D2"/><text x="922" y="257" fill="#FFF" font-size="12">✓</text>
      <text x="940" y="257" fill="#263238">确认已佩戴防毒面具与手套</text>
      <rect x="1180" y="244" width="44" height="18" rx="3" fill="#D32F2F"/><text x="1202" y="257" fill="#FFF" font-size="11" text-anchor="middle">必填</text>
    </g>
    <!-- gate hint -->
    <rect x="912" y="284" width="316" height="44" rx="4" fill="#FFEBEE" stroke="#FFCDD2"/>
    <text x="920" y="303" font-size="11.5" fill="#C62828">安全门:必填项未全部勾选时</text>
    <text x="920" y="319" font-size="11.5" fill="#C62828">「下一步」禁用(代码层强制不可绕过)。</text>
    <!-- nav buttons -->
    <g font-size="13" text-anchor="middle">
      <rect x="912" y="604" width="74" height="34" rx="4" fill="#ECEFF1" stroke="#B0BEC5"/><text x="949" y="626" fill="#37474F">重练</text>
      <rect x="996" y="604" width="84" height="34" rx="4" fill="#ECEFF1" stroke="#B0BEC5"/><text x="1038" y="626" fill="#37474F">上一步</text>
      <rect x="1090" y="604" width="138" height="34" rx="4" fill="#1976D2"/><text x="1159" y="626" fill="#FFF" font-weight="700">下一步 ▶</text>
    </g>

    <!-- disclaimer -->
    <rect y="664" width="1240" height="36" fill="#B71C1C"/>
    <text x="620" y="687" font-size="13" font-weight="600" fill="#FFF" text-anchor="middle">⚠ 训练辅助,实际作业以官方程序为准 / 訓練補助。実際の作業は公式手順に従ってください。</text>
  </g>

  <!-- ================= SCREEN 3: 考核模式 / Exam ================= -->
  <text x="40" y="1600" font-size="18" font-weight="700" fill="#37474F">③ 考核模式覆盖层(M10)</text>
  <g transform="translate(40,1620)">
    <rect width="1240" height="700" rx="6" fill="#FFFFFF" stroke="#B0BEC5"/>
    <!-- dimmed training behind -->
    <rect width="1240" height="700" rx="6" fill="#20262E" opacity="0.06"/>
    <rect width="1240" height="48" rx="6" fill="#1E2A38" opacity="0.5"/>
    <text x="16" y="31" font-size="15" font-weight="700" fill="#FFFFFF">除害装置 3D 维护训练系统</text>

    <!-- modal -->
    <g transform="translate(340,120)">
      <rect width="560" height="470" rx="8" fill="#FFFFFF" stroke="#9E9E9E"/>
      <text x="20" y="36" font-size="18" font-weight="700" fill="#263238">考核模式 / 試験モード</text>
      <text x="20" y="60" font-size="13" fill="#607D8B">请把步骤拖动/上下移动排列为正确顺序。</text>
      <!-- shuffled list -->
      <g font-size="13" fill="#263238">
        <rect x="20" y="76" width="520" height="40" rx="4" fill="#F5F5F5" stroke="#E0E0E0"/>
        <text x="34" y="101">取出滤芯(确认已吹扫后向上抽出)</text>
        <rect x="20" y="122" width="520" height="40" rx="4" fill="#E3F2FD" stroke="#90CAF9"/>
        <text x="34" y="147">拧下四角螺栓,取下前面板</text>
        <rect x="20" y="168" width="520" height="40" rx="4" fill="#F5F5F5" stroke="#E0E0E0"/>
        <text x="34" y="193">目视检查送风机叶轮</text>
      </g>
      <text x="20" y="240" font-size="11" fill="#90A4AE">提交后与正确 order 比对:显示正确率,错处行标红。安全确认在考核模式仍强制。</text>
      <!-- result -->
      <rect x="20" y="256" width="520" height="40" rx="4" fill="#E8F5E9" stroke="#A5D6A7"/>
      <text x="34" y="281" font-size="13" font-weight="700" fill="#2E7D32">正确率 / 正答率:2/3 (67%)</text>
      <!-- buttons -->
      <g font-size="13" text-anchor="middle">
        <rect x="20" y="416" width="70" height="34" rx="4" fill="#ECEFF1" stroke="#B0BEC5"/><text x="55" y="438" fill="#37474F">上移</text>
        <rect x="98" y="416" width="70" height="34" rx="4" fill="#ECEFF1" stroke="#B0BEC5"/><text x="133" y="438" fill="#37474F">下移</text>
        <rect x="360" y="416" width="100" height="34" rx="4" fill="#1976D2"/><text x="410" y="438" fill="#FFF" font-weight="700">提交评分</text>
        <rect x="470" y="416" width="70" height="34" rx="4" fill="#ECEFF1" stroke="#B0BEC5"/><text x="505" y="438" fill="#37474F">关闭 ✕</text>
      </g>
    </g>

    <rect y="664" width="1240" height="36" fill="#B71C1C"/>
    <text x="620" y="687" font-size="13" font-weight="600" fill="#FFF" text-anchor="middle">⚠ 训练辅助,实际作业以官方程序为准 / 訓練補助。実際の作業は公式手順に従ってください。</text>
  </g>

  <text x="40" y="2380" font-size="13" fill="#607D8B">配色:顶栏 #1E2A38 · 视口 #20262E · 说明卡 #FFF8E1 · 必填徽标 #D32F2F · 主操作 #1976D2 · 免责横幅 #B71C1C</text>
  <text x="40" y="2404" font-size="13" fill="#607D8B">红框标注「计划新增」:考核模式将在每个排好的步骤上继续强制安全确认(M10 规范点)。</text>
</svg>
